[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "StarAppBuilder"
version = "0.2.2"
description = "Starlight App Builder"
requires-python = ">=3.9"
dependencies = ["tqdm", "pillow"]

[project.scripts]
star_app_builder = "star_app_builder.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/star_app_builder"]

# Compile BasisUniversal and embed the basisu binary in the wheel. Scoped to
# the wheel target so sdist creation does not trigger a native build.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"